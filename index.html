<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self'; media-src file: blob:">
<title>Audio Join</title>
<style>
  :root { --bg:#f5f5f5; --side:#fff; --card:#fff; --text:#1f2328; --muted:#6b7280; --accent:#1a73e8; --accent-soft:#e8f0fe; --border:#e4e4e7; --ok:#15803d; --err:#b91c1c; --rec:#d93025; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17181c; --side:#1e2025; --card:#1e2025; --text:#e8eaed; --muted:#9aa0a6; --accent:#5b9cf5; --accent-soft:#243247; --border:#30343b; --rec:#f0645a; } }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:13px/1.4 "Segoe UI",system-ui,sans-serif; overflow:hidden; }
  .app { display:grid; grid-template-columns:190px 1fr; height:100%; }
  aside { background:var(--side); border-right:1px solid var(--border); padding:14px 10px; display:flex; flex-direction:column; gap:14px; }
  .brand { display:flex; align-items:center; gap:9px; padding:2px 6px; }
  .brand img { width:30px; height:30px; }
  .brand b { display:block; font-size:14px; line-height:1.1; }
  .brand span { color:var(--muted); font-size:11px; }
  nav { display:flex; flex-direction:column; gap:2px; }
  .nav { display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:8px 10px; border:0; border-radius:6px; background:none; color:var(--text); cursor:pointer; font:inherit; }
  .nav:hover { background:var(--bg); }
  .nav.active { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .nav svg { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  main { padding:22px 26px; overflow:auto; }
  section[hidden] { display:none; }
  h2 { margin:0 0 2px; font-size:18px; }
  .sub { color:var(--muted); margin-bottom:16px; font-size:12.5px; }
  body.dragging::after { content:"Drop audio files here"; position:fixed; inset:8px; border:2px dashed var(--accent); border-radius:10px; background:rgba(26,115,232,.1); display:grid; place-items:center; font-size:16px; font-weight:600; color:var(--accent); pointer-events:none; }

  .slot { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:8px 9px; margin-bottom:8px; }
  .slot.over { border-color:var(--accent); box-shadow:0 0 0 3px rgba(26,115,232,.2); }
  .head { display:flex; align-items:center; gap:7px; }
  .num { width:22px; height:22px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-size:11px; font-weight:600; flex:none; }
  .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .name.empty { color:var(--muted); }
  .player { margin-top:7px; }
  audio { width:100%; height:32px; display:block; }
  button { font:inherit; font-size:12.5px; cursor:pointer; border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:6px; padding:5px 10px; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; padding:7px 16px; }
  button.primary:hover:not(:disabled) { filter:brightness(1.08); }
  button.recbtn { color:var(--rec); }
  button.recbtn:hover:not(:disabled) { border-color:var(--rec); }
  button.recgo { background:var(--rec); border-color:var(--rec); color:#fff; font-weight:600; }
  button.link { border:0; background:none; color:var(--accent); padding:2px 4px; }
  .icon { padding:4px 7px; line-height:1; }

  .recpanel { margin-top:8px; padding:8px; border:1px dashed var(--border); border-radius:6px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .recpanel select { max-width:300px; }
  .recpanel .msg { color:var(--muted); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--rec); animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .timer { font-variant-numeric:tabular-nums; font-weight:600; min-width:42px; }

  .adjust { margin-top:6px; }
  .adj { display:grid; grid-template-columns:60px 1fr 52px; align-items:center; gap:8px; margin-top:5px; }
  .adj label { color:var(--muted); }
  .adj input[type=range] { width:100%; accent-color:var(--accent); }
  .adj output { text-align:right; font-variant-numeric:tabular-nums; }
  .hint { color:var(--muted); font-size:11.5px; margin-top:6px; }

  .row { display:flex; gap:10px; align-items:center; margin-top:14px; flex-wrap:wrap; }
  .row label { color:var(--muted); }
  select { font:inherit; font-size:12.5px; padding:5px 8px; border-radius:6px; border:1px solid var(--border); background:var(--card); color:var(--text); }
  .status { margin-top:10px; min-height:18px; font-size:12.5px; }
  .err { color:var(--err); white-space:pre-wrap; font-size:12px; }
  .ok { color:var(--ok); }
  .result { display:none; margin-top:12px; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
  .result h3 { margin:0 0 8px; font-size:12.5px; font-weight:600; }
  .result .row { margin-top:10px; }

  .opts { margin-top:14px; display:flex; flex-direction:column; gap:9px; }
  .check { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .check label { display:flex; align-items:center; gap:7px; }
  .dest { display:flex; align-items:center; gap:8px; }
  .dest label { color:var(--muted); }
  input[type=text] { font:inherit; font-size:12.5px; padding:5px 8px; border-radius:6px; border:1px solid var(--border); background:var(--card); color:var(--text); min-width:0; }
  input[type=text]:disabled { opacity:.5; }
  .dest input[type=text] { flex:1; }
  .item { padding:3px 0; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.4); display:grid; place-items:center; z-index:10; }
  .box { background:var(--card); border-radius:10px; padding:16px 18px; width:380px; max-width:90vw; box-shadow:0 10px 30px rgba(0,0,0,.3); }
  .box p { margin:0; line-height:1.5; }
  .box .row { justify-content:flex-end; }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><img src="build/icon.png" alt=""><div><b>Audio Join</b><span id="ver"></span></div></div>
    <nav>
      <button class="nav active" data-view="join">
        <svg viewBox="0 0 24 24"><path d="M4 6h5l4 6-4 6H4M20 6h-5l-1.5 2.2M20 18h-5l-1.5-2.2M17 3l3 3-3 3M17 15l3 3-3 3"/></svg>Join files</button>
      <button class="nav" data-view="convert">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 9M20 4v5h-5M20 12a8 8 0 0 1-13.7 5.6L4 15M4 20v-5h5"/></svg>Convert files</button>
    </nav>
  </aside>

  <main>
    <section id="view-join">
      <h2>Join files</h2>
      <div class="sub">Drag audio files onto the window, choose them, or record with a microphone. They are joined in order with no gap.</div>
      <div id="slots"></div>
      <button id="add">+ Add another file</button>
      <div id="join-actions"></div>
    </section>

    <section id="view-convert" hidden>
      <h2>Convert files</h2>
      <div class="sub">Drag one or more audio files onto the window, choose them, or record. Pick the format (for example MP3 to WAV) and where to save them.</div>
      <div id="convert-slots"></div>
      <button id="convert-add">+ Add another file</button>
      <div id="convert-actions"></div>
    </section>
  </main>
</div>

<script>
const AUDIO_EXT = /\.(wav|mp3|m4a|aac|flac|ogg|wma|opus|aiff?)$/i;
const MIME = { wav:'audio/wav', mp3:'audio/mpeg', m4a:'audio/mp4', aac:'audio/aac', flac:'audio/flac', ogg:'audio/ogg', opus:'audio/ogg', wma:'audio/x-ms-wma', aif:'audio/aiff', aiff:'audio/aiff' };
const FORMATS = [['mp3','MP3'],['wav','WAV'],['m4a','M4A (AAC)'],['flac','FLAC'],['ogg','OGG']];
const QUALITIES = [['best','Best quality'],['balanced','Balanced (smaller)'],['small','Small'],['smallest','Smallest']];

let view = 'join';
let busyKind = null;
let recCount = 0, recId = 0;

// a slot = one audio source (uploaded file or recording) + its sound adjustments
const mkSlot = () => ({ file: null, vol: 100, bass: 0, treble: 0, adjustOpen: false, rec: null, fx: null });
let slots = [mkSlot(), mkSlot()];
let convSlots = [mkSlot()];

const isEmpty = s => !s.file && !s.rec;
const mmss = ms => { const t = Math.floor(ms / 1000); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const currentRender = () => view === 'join' ? renderJoin() : renderConvert();

function setFile(s, f) {
  if (s.file) {
    if (s.file.recorded) window.api.deleteTemp(s.file.path);
    if (s.file.url) URL.revokeObjectURL(s.file.url);
  }
  s.file = f; s.fx = null;
}

// Load a file into memory so it can be played with live sound changes.
async function loadFileData(s, f) {
  try {
    const bytes = await window.api.readFile(f.path);
    if (s.file !== f) return;                       // replaced or removed while loading
    const ext = (f.path.split('.').pop() || '').toLowerCase();
    f.url = URL.createObjectURL(new Blob([bytes], { type: MIME[ext] || 'audio/*' }));
  } catch (e) {
    if (s.file !== f) return;
    f.error = 'Could not open this file.';
  }
  if (s.file === f) { f.loading = false; currentRender(); }
}
function adopt(s, raw, recorded) {
  const f = { path: raw.path, name: raw.name, url: null, loading: true, recorded: !!recorded };
  setFile(s, f);
  loadFileData(s, f);
}

// ---------- live sound preview (volume, bass, treble) ----------
let actx = null;
// soft limiter curve (only used while boosting): identical below 0.8, then rounds off smoothly under 0.97
const SOFT_CURVE = (() => {
  const n = 4096, T = 0.8, L = 0.97, c = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i / (n - 1)) * 2 - 1, a = Math.abs(x);
    c[i] = Math.sign(x) * (a <= T ? a : T + (L - T) * Math.tanh((a - T) / (L - T)));
  }
  return c;
})();
function attachFx(s, au) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const src = actx.createMediaElementSource(au);
    const bass = actx.createBiquadFilter();   bass.type = 'lowshelf';   bass.frequency.value = 200;
    const treble = actx.createBiquadFilter(); treble.type = 'highshelf'; treble.frequency.value = 3000;
    const gain = actx.createGain();
    const lim = actx.createWaveShaper();
    src.connect(bass); bass.connect(treble); treble.connect(gain); gain.connect(lim); lim.connect(actx.destination);
    s.fx = { bass, treble, gain, lim };
    applyFx(s);
    au.addEventListener('play', () => { if (actx.state === 'suspended') actx.resume(); });
  } catch (e) { s.fx = null; }
}
function applyFx(s) {
  if (!s.fx) return;
  s.fx.gain.gain.value = s.vol / 100;
  s.fx.bass.gain.value = s.bass;
  s.fx.treble.gain.value = s.treble;
  s.fx.lim.curve = (s.vol > 100 || s.bass > 0 || s.treble > 0) ? SOFT_CURVE : null;   // limiter only when boosting
}

// ---------- confirmation popup ----------
function confirmBox(message, okLabel) {
  return new Promise(resolve => {
    const o = document.createElement('div');
    o.className = 'modal';
    o.innerHTML = '<div class="box"><p></p><div class="row"><button data-v="0">Cancel</button><button class="primary" data-v="1"></button></div></div>';
    o.querySelector('p').textContent = message;
    o.querySelector('.primary').textContent = okLabel || 'Proceed';
    o.onclick = e => { const v = e.target.dataset && e.target.dataset.v; if (v !== undefined) { o.remove(); resolve(v === '1'); } };
    document.body.appendChild(o);
  });
}

// ---------- recording ----------
async function openRecord(s, rerender) {
  if (s.rec) return;
  if (s.file) {
    const what = s.file.recorded ? 'The current recording' : 'The uploaded file';
    const ok = await confirmBox(what + ' will be removed when you record. Do you want to proceed?');
    if (!ok) return;
    setFile(s, null);
  }
  s.rec = { id: ++recId, phase: 'setup', devices: [], deviceId: null, error: null };
  rerender();
  const rec = s.rec;
  try {
    const tmp = await navigator.mediaDevices.getUserMedia({ audio: true }); // asks permission so device names show
    tmp.getTracks().forEach(t => t.stop());
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput');
    if (s.rec !== rec) return;
    rec.devices = devs;
    const def = devs.find(d => d.deviceId === 'default') || devs[0];
    rec.deviceId = def ? def.deviceId : null;
    if (!devs.length) rec.error = 'No microphone found.';
  } catch (e) {
    if (s.rec !== rec) return;
    rec.error = 'Could not access the microphone. In Windows Settings > Privacy & security > Microphone, allow microphone access (including for desktop apps).';
  }
  rerender();
}

async function startRecording(s, rerender) {
  const rec = s.rec;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: rec.deviceId ? { deviceId: { exact: rec.deviceId } } : true });
    const mr = new MediaRecorder(stream);
    const chunks = [];
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(rec.timer);
      if (rec.discard) { if (s.rec === rec) s.rec = null; rerender(); return; }
      const blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
      const data = new Uint8Array(await blob.arrayBuffer());
      const r = await window.api.saveRecording(data);
      if (s.rec !== rec) { if (r.ok) window.api.deleteTemp(r.path); return; }
      s.rec = null;
      if (r.ok) adopt(s, { path: r.path, name: 'Recording ' + (++recCount) }, true);
      else s.rec = { id: ++recId, phase: 'setup', devices: rec.devices, deviceId: rec.deviceId, error: 'Recording failed: ' + r.error };
      rerender();
    };
    rec.mr = mr; rec.phase = 'recording'; rec.start = Date.now();
    mr.start();
    rec.timer = setInterval(() => {
      const el = document.querySelector('[data-timer="' + rec.id + '"]');
      if (el) el.textContent = mmss(Date.now() - rec.start);
    }, 250);
    rerender();
  } catch (e) {
    rec.error = 'Could not start the microphone: ' + (e.message || e);
    rerender();
  }
}

// ---------- one audio source (used by Join and Convert) ----------
function createSlot(s, o) {
  const d = document.createElement('div');
  d.className = 'slot';
  const busy = !!s.rec;
  const f = s.file;
  const xOff = isEmpty(s) && !o.canRemoveSlot;
  d.innerHTML = `<div class="head">
      ${o.index != null ? `<div class="num">${o.index + 1}</div>` : ''}
      <div class="name ${f ? '' : 'empty'}"></div>
      <button data-a="pick" ${busy ? 'disabled' : ''}>${f && !f.recorded ? 'Change' : 'Choose file…'}</button>
      <button class="recbtn" data-a="rec" ${busy ? 'disabled' : ''}>● Record</button>
      ${o.movable ? `<button class="icon" data-a="up" ${o.index === 0 || busy ? 'disabled' : ''} title="Move up">↑</button>
      <button class="icon" data-a="down" ${o.index === o.total - 1 || busy ? 'disabled' : ''} title="Move down">↓</button>` : ''}
      <button class="icon" data-a="x" ${xOff ? 'disabled' : ''} title="${s.rec ? 'Cancel recording' : f ? 'Remove file' : 'Remove this slot'}">✕</button>
    </div>`;
  d.querySelector('.name').textContent = f ? f.name : (s.rec ? (s.rec.phase === 'recording' ? 'Recording…' : 'Set up recording') : (o.emptyText || 'Drop a file here, choose one, or record'));

  if (s.rec) {
    const r = s.rec;
    const p = document.createElement('div');
    p.className = 'recpanel';
    if (r.phase === 'setup') {
      p.innerHTML = `<label>Microphone</label><select data-a="mic"></select>
        <button class="recgo" data-a="start">● Start recording</button><button data-a="cancelrec">Cancel</button><span class="msg"></span>`;
      const sel = p.querySelector('select');
      if (!r.devices.length) { const op = document.createElement('option'); op.textContent = r.error ? 'Not available' : 'Looking for microphones…'; sel.appendChild(op); sel.disabled = true; }
      r.devices.forEach((dv, i) => {
        const op = document.createElement('option');
        op.value = dv.deviceId; op.textContent = dv.label || ('Microphone ' + (i + 1));
        if (dv.deviceId === r.deviceId) op.selected = true;
        sel.appendChild(op);
      });
      sel.onchange = () => { r.deviceId = sel.value; };
      p.querySelector('[data-a=start]').disabled = !r.devices.length;
      if (r.error) { const m = p.querySelector('.msg'); m.className = 'err'; m.textContent = r.error; }
    } else {
      const label = (r.devices.find(x => x.deviceId === r.deviceId) || {}).label || 'Microphone';
      p.innerHTML = `<span class="dot"></span><span class="timer" data-timer="${r.id}">00:00</span><span class="msg"></span>
        <button class="primary" data-a="stop">■ Stop</button>`;
      p.querySelector('.msg').textContent = label;
    }
    d.appendChild(p);
  }

  if (f && f.loading) {
    const h = document.createElement('div'); h.className = 'hint'; h.textContent = 'Loading…'; d.appendChild(h);
  } else if (f && f.error) {
    const h = document.createElement('div'); h.className = 'err'; h.textContent = f.error; d.appendChild(h);
  } else if (f) {
    const pl = document.createElement('div');
    pl.className = 'player';
    const au = document.createElement('audio');
    au.controls = true; au.preload = 'metadata'; au.src = f.url;
    au.setAttribute('controlsList', 'nodownload noplaybackrate');
    au.onerror = () => {
      const h = document.createElement('div'); h.className = 'hint';
      h.textContent = 'This format can’t be previewed here, but it will still work when you join or convert.';
      pl.appendChild(h);
    };
    pl.appendChild(au);
    d.appendChild(pl);
    attachFx(s, au);

    const adj = document.createElement('div');
    adj.className = 'adjust';
    const changed = () => s.vol !== 100 || s.bass !== 0 || s.treble !== 0;
    adj.innerHTML = `<button class="link" data-a="adj"></button><div class="panel" ${s.adjustOpen ? '' : 'hidden'}>
        <div class="adj"><label>Volume</label><input type="range" min="10" max="300" step="5" data-k="vol"><output></output></div>
        <div class="adj"><label>Bass</label><input type="range" min="-10" max="10" step="1" data-k="bass"><output></output></div>
        <div class="adj"><label>Treble</label><input type="range" min="-10" max="10" step="1" data-k="treble"><output></output></div>
        <div class="hint">You hear changes live while the file plays. They are applied to the saved file too.
          <button class="link" data-a="reset">Reset</button></div></div>`;
    const toggle = adj.querySelector('[data-a=adj]');
    const panel = adj.querySelector('.panel');
    const inputs = [...adj.querySelectorAll('input[type=range]')];
    const label = () => { toggle.textContent = (s.adjustOpen ? '▾' : '▸') + ' Adjust sound' + (changed() ? ' (changed)' : ''); };
    const fmt = (k, v) => k === 'vol' ? v + '%' : (v > 0 ? '+' : '') + v + ' dB';
    const show = i => { i.value = s[i.dataset.k]; i.nextElementSibling.textContent = fmt(i.dataset.k, s[i.dataset.k]); };
    inputs.forEach(i => {
      show(i);
      i.oninput = () => { s[i.dataset.k] = Number(i.value); show(i); applyFx(s); label(); };
    });
    toggle.onclick = () => { s.adjustOpen = !s.adjustOpen; panel.hidden = !s.adjustOpen; label(); };
    adj.querySelector('[data-a=reset]').onclick = () => { s.vol = 100; s.bass = 0; s.treble = 0; inputs.forEach(show); applyFx(s); label(); };
    label();
    d.appendChild(adj);
  }

  d.addEventListener('dragover', e => { e.preventDefault(); d.classList.add('over'); });
  d.addEventListener('dragleave', () => d.classList.remove('over'));
  d.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation();
    d.classList.remove('over'); document.body.classList.remove('dragging'); dragDepth = 0;
    if (s.rec) return;
    const files = filesFromDrop(e); if (files.length) o.onFiles(files);
  });
  d.addEventListener('click', async ev => {
    const a = ev.target.dataset && ev.target.dataset.a; if (!a) return;
    const re = o.rerender;
    if (a === 'pick') { const files = await window.api.pickFile(o.multi); if (files.length) o.onFiles(files); }
    else if (a === 'rec') openRecord(s, re);
    else if (a === 'start') startRecording(s, re);
    else if (a === 'stop') { if (s.rec.mr && s.rec.mr.state !== 'inactive') s.rec.mr.stop(); }
    else if (a === 'cancelrec') { s.rec = null; re(); }
    else if (a === 'up') o.move(-1);
    else if (a === 'down') o.move(1);
    else if (a === 'x') {
      // the X always works: cancels a recording, removes a file, or (when empty) removes the slot
      if (s.rec) {
        if (s.rec.phase === 'recording' && s.rec.mr && s.rec.mr.state !== 'inactive') { s.rec.discard = true; s.rec.mr.stop(); }
        else { s.rec = null; re(); }
      } else if (s.file) { setFile(s, null); re(); }
      else if (o.remove) o.remove();
    }
  });
  return d;
}

// ---------- drag & drop helpers ----------
function filesFromDrop(ev) {
  return [...ev.dataTransfer.files].filter(f => AUDIO_EXT.test(f.name))
    .map(f => ({ path: window.api.pathForFile(f), name: f.name }));
}

// ---------- JOIN view ----------
function placeInto(list, files, start, render) {
  files.forEach((f, k) => {
    let target = null;
    if (k === 0 && start != null) target = list[start];
    else {
      const from = start != null ? start + 1 : 0;
      target = list.find((s, i) => i >= from && isEmpty(s));
      if (!target) { target = mkSlot(); list.push(target); }
    }
    if (target.rec) return;
    adopt(target, f, false);
  });
  render();
}
const place = (files, start) => placeInto(slots, files, start, renderJoin);
function renderJoin() {
  const el = document.getElementById('slots');
  el.innerHTML = '';
  slots.forEach((s, i) => el.appendChild(createSlot(s, {
    index: i, total: slots.length, movable: true, multi: true, rerender: renderJoin,
    canRemoveSlot: slots.length > 2,
    emptyText: 'File ' + (i + 1) + ': drop a file here, choose one, or record',
    onFiles: files => place(files, i),
    move: dir => { [slots[i + dir], slots[i]] = [slots[i], slots[i + dir]]; renderJoin(); },
    remove: () => { slots.splice(i, 1); renderJoin(); },
  })));
}
document.getElementById('add').onclick = () => { slots.push(mkSlot()); renderJoin(); };

// ---------- CONVERT view ----------
function renderConvert() {
  const el = document.getElementById('convert-slots');
  el.innerHTML = '';
  convSlots.forEach((s, i) => el.appendChild(createSlot(s, {
    index: i, total: convSlots.length, movable: false, multi: true, rerender: renderConvert,
    canRemoveSlot: convSlots.length > 1,
    emptyText: 'File ' + (i + 1) + ': drop a file here, choose one, or record',
    onFiles: files => placeInto(convSlots, files, i, renderConvert),
    remove: () => { convSlots.splice(i, 1); renderConvert(); },
  })));
}
document.getElementById('convert-add').onclick = () => { convSlots.push(mkSlot()); renderConvert(); };

let convDest = '';
function buildConvertActions() {
  const t = new Date(), p2 = n => String(n).padStart(2, '0');
  const ds = t.getFullYear() + '-' + p2(t.getMonth() + 1) + '-' + p2(t.getDate());
  document.getElementById('convert-actions').innerHTML = `
    <div class="row">
      <label>Format</label>
      <select id="convert-format">${FORMATS.map(([v, x]) => `<option value="${v}">${x}</option>`).join('')}</select>
      <label>Size</label>
      <select id="convert-quality">${QUALITIES.map(([v, x]) => `<option value="${v}">${x}</option>`).join('')}</select>
    </div>
    <div class="opts">
      <div class="check"><label><input type="checkbox" id="convert-newname"> Create a new name for each file (number + date) instead of keeping the old name</label></div>
      <div class="dest"><label>Save to</label><input type="text" id="convert-dest" readonly placeholder="Choose a folder…"><button id="convert-browse">Browse…</button></div>
      <div class="check"><label><input type="checkbox" id="convert-newfolder"> Put the files in a new folder named</label><input type="text" id="convert-foldername" value="Converted ${ds}" disabled></div>
    </div>
    <div class="hint">Recordings have no file name, so they always get a number + date name. Nothing is ever overwritten: if a name already exists, “(2)” is added.</div>
    <div class="row"><button class="primary" id="convert-go">Convert &amp; save</button></div>
    <div class="status" id="convert-status"></div>
    <div id="convert-results"></div>`;
  const $ = id => document.getElementById('convert-' + id);

  window.api.getDefaultDir().then(d => { if (!convDest) { convDest = d; $('dest').value = d; } });
  $('newfolder').onchange = () => { $('foldername').disabled = !$('newfolder').checked; };
  $('browse').onclick = async () => { const d = await window.api.pickFolder(); if (d) { convDest = d; $('dest').value = d; } };

  window.api.onBatchProgress(pr => {
    const st = $('status'); st.className = 'status';
    st.textContent = 'Converting ' + pr.index + ' of ' + pr.total + ': ' + pr.name + ' …';
  });

  $('go').onclick = async () => {
    const st = $('status'), res = $('results');
    const fail = m => { st.className = 'status err'; st.textContent = m; };
    res.innerHTML = '';
    if (convSlots.some(s => s.rec)) return fail('Please finish or cancel the recording first.');
    if (convSlots.some(s => s.file && s.file.loading)) return fail('Please wait, a file is still loading.');
    const list = convSlots.filter(s => s.file && !s.file.error);
    if (!list.length) return fail('Please add at least one file first.');
    if (!convDest) return fail('Please choose where to save the files.');
    const items = list.map(s => ({ path: s.file.path, name: s.file.name, recorded: !!s.file.recorded, vol: s.vol, bass: s.bass, treble: s.treble }));
    $('go').disabled = true; st.className = 'status'; st.textContent = 'Working…';
    const r = await window.api.convertBatch({
      items, format: $('format').value, quality: $('quality').value, destDir: convDest,
      newFolder: $('newfolder').checked ? $('foldername').value : '', newNames: $('newname').checked,
    });
    $('go').disabled = false;
    if (!r.ok) return fail('Something went wrong: ' + r.error);
    const okCount = r.results.filter(x => x.ok).length;
    st.className = okCount === r.results.length ? 'status ok' : 'status err';
    st.textContent = '✔ ' + okCount + ' of ' + r.results.length + ' files saved to ' + r.dir;
    r.results.forEach(x => {
      const d = document.createElement('div'); d.className = 'item ' + (x.ok ? 'ok' : 'err');
      d.textContent = x.ok ? '✔ ' + x.name + '  (' + fmtSize(x.size) + ')' : '✖ ' + x.name + ': ' + x.error;
      res.appendChild(d);
    });
    const b = document.createElement('button'); b.textContent = 'Open folder';
    b.onclick = () => window.api.openFolder(r.dir); res.appendChild(b);
  };
}

// ---------- JOIN: format + size + status + preview + save ----------
function buildActions(k, goLabel) {
  document.getElementById(k + '-actions').innerHTML = `
    <div class="row">
      <label>Format</label>
      <select id="${k}-format">${FORMATS.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select>
      <label>Size</label>
      <select id="${k}-quality">${QUALITIES.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select>
      <button class="primary" id="${k}-go">${goLabel}</button>
    </div>
    <div class="hint">For smaller files choose MP3, M4A or OGG with Small or Smallest. WAV and FLAC stay large.</div>
    <div class="status" id="${k}-status"></div>
    <div class="result" id="${k}-result">
      <h3>Result <span id="${k}-size" style="font-weight:400;color:var(--muted)"></span></h3>
      <audio id="${k}-player" controls controlsList="nodownload noplaybackrate"></audio>
      <div class="row"><button class="primary" id="${k}-save">Save as…</button><span id="${k}-saved"></span></div>
    </div>`;
  const $ = id => document.getElementById(k + '-' + id);

  $('go').onclick = async () => {
    const st = $('status');
    const fail = m => { st.className = 'status err'; st.textContent = m; };
    if (slots.some(s => s.rec)) return fail('Please finish or cancel the recording first.');
    if (slots.some(s => s.file && s.file.loading)) return fail('Please wait, a file is still loading.');
    const inputs = slots.filter(s => s.file && !s.file.error).map(s => ({ path: s.file.path, vol: s.vol, bass: s.bass, treble: s.treble }));
    if (inputs.length < 2) return fail('Please add at least two files.');
    $('go').disabled = true; $('result').style.display = 'none'; $('player').pause();
    st.className = 'status'; st.textContent = 'Working…'; busyKind = k;
    const r = await window.api.process(k, inputs, $('format').value, $('quality').value);
    busyKind = null; $('go').disabled = false;
    if (r.ok) {
      st.className = 'status ok'; st.textContent = '✔ Ready. Listen below, then save it.';
      $('player').src = r.url; $('result').style.display = 'block'; $('saved').textContent = '';
      $('size').textContent = '(' + fmtSize(r.size) + ')';
    } else fail('Something went wrong:\n' + r.error);
  };

  $('save').onclick = async () => {
    const r = await window.api.save(k);
    const s = $('saved');
    if (r.canceled) return;
    if (r.ok) {
      s.className = 'ok'; s.textContent = '✔ Saved ';
      const b = document.createElement('button'); b.textContent = 'Show in folder';
      b.onclick = () => window.api.reveal(r.path); s.appendChild(b);
    } else { s.className = 'err'; s.textContent = r.error; }
  };
}
buildActions('join', 'Join &amp; create');
buildConvertActions();

window.api.onProgress(t => {
  if (!busyKind) return;
  const st = document.getElementById(busyKind + '-status');
  st.className = 'status'; st.textContent = 'Working… processed ' + t;
});
window.api.version().then(v => document.getElementById('ver').textContent = 'v' + v);

// ---------- sidebar ----------
document.querySelectorAll('.nav').forEach(b => b.onclick = () => {
  view = b.dataset.view;
  document.querySelectorAll('.nav').forEach(x => x.classList.toggle('active', x === b));
  document.getElementById('view-join').hidden = view !== 'join';
  document.getElementById('view-convert').hidden = view !== 'convert';
  document.querySelectorAll('audio').forEach(a => a.pause());
});

// ---------- drop anywhere on the window ----------
let dragDepth = 0;
window.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  const files = filesFromDrop(e); if (!files.length) return;
  if (view === 'join') place(files, null);
  else placeInto(convSlots, files, null, renderConvert);
});

renderJoin(); renderConvert();
</script>
</body>
</html>
